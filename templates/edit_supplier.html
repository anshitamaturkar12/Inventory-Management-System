{% extends 'base.html' %}

{% block title %}Edit Supplier — Inventory Management System{% endblock %}
{% block heading %}Edit Supplier #{{ supplier.supplier_id }}{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="card-header">
        <div class="header-title-group">
            <h3>Update Supplier Details</h3>
            <p class="subtitle">Modify vendor details for {{ supplier.supplier_name }}</p>
        </div>
    </div>
    <div class="card-body">
        <form action="{{ url_for('suppliers.edit_supplier', supplier_id=supplier.supplier_id) }}" method="POST" class="styled-form">
            <div class="form-group">
                <label for="supplier_name">Supplier Name <span class="required">*</span></label>
                <input 
                    type="text" 
                    id="supplier_name" 
                    name="supplier_name" 
                    class="form-control" 
                    value="{{ supplier.supplier_name }}"
                    required
                >
            </div>

            <div class="form-row">
                <div class="form-group col-half">
                    <label for="phone">Phone Number</label>
                    <input 
                        type="text" 
                        id="phone" 
                        name="phone" 
                        class="form-control" 
                        value="{{ supplier.phone or '' }}"
                    >
                </div>

                <div class="form-group col-half">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-control" 
                        value="{{ supplier.email or '' }}"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="address">Postal Address / City</label>
                <textarea 
                    id="address" 
                    name="address" 
                    rows="3" 
                    class="form-control"
                >{{ supplier.address or '' }}</textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('suppliers.list_suppliers') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
