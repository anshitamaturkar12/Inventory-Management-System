{% extends 'base.html' %}

{% block title %}Add Warehouse — Inventory Management System{% endblock %}
{% block heading %}Add New Warehouse{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="card-header">
        <div class="header-title-group">
            <h3>Warehouse Details</h3>
            <p class="subtitle">Specify the storage facility identifier and location</p>
        </div>
    </div>
    <div class="card-body">
        <form action="{{ url_for('warehouses.add_warehouse') }}" method="POST" class="styled-form">
            <div class="form-group">
                <label for="warehouse_name">Warehouse Name <span class="required">*</span></label>
                <input 
                    type="text" 
                    id="warehouse_name" 
                    name="warehouse_name" 
                    class="form-control" 
                    placeholder="e.g. North Regional Hub" 
                    value="{{ warehouse_name or '' }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="location">Location / Address</label>
                <input 
                    type="text" 
                    id="location" 
                    name="location" 
                    class="form-control" 
                    placeholder="e.g. Industrial Area 4, Noida" 
                    value="{{ location or '' }}"
                >
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Add Warehouse</button>
                <a href="{{ url_for('warehouses.list_warehouses') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
