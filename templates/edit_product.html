{% extends 'base.html' %}

{% block title %}Edit Product — Inventory Management System{% endblock %}
{% block heading %}Edit Product #{{ product.product_id }}{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="card-header">
        <div class="header-title-group">
            <h3>Update Product Details</h3>
            <p class="subtitle">Modify details for {{ product.product_name }}</p>
        </div>
    </div>
    <div class="card-body">
        <form action="{{ url_for('products.edit_product', product_id=product.product_id) }}" method="POST" class="styled-form">
            <div class="form-group">
                <label for="product_name">Product Name <span class="required">*</span></label>
                <input 
                    type="text" 
                    id="product_name" 
                    name="product_name" 
                    class="form-control" 
                    value="{{ product.product_name }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="category">Category <span class="required">*</span></label>
                <input 
                    type="text" 
                    id="category" 
                    name="category" 
                    class="form-control" 
                    value="{{ product.category }}"
                    required
                >
            </div>

            <div class="form-row">
                <div class="form-group col-half">
                    <label for="price">Unit Price (₹) <span class="required">*</span></label>
                    <input 
                        type="number" 
                        id="price" 
                        name="price" 
                        step="0.01" 
                        min="0" 
                        class="form-control" 
                        value="{{ product.price }}"
                        required
                    >
                </div>

                <div class="form-group col-half">
                    <label for="minimum_stock">Minimum Stock Alert Level <span class="required">*</span></label>
                    <input 
                        type="number" 
                        id="minimum_stock" 
                        name="minimum_stock" 
                        min="0" 
                        class="form-control" 
                        value="{{ product.minimum_stock }}"
                        required
                    >
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('products.list_products') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
